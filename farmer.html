<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Dashboard - FarmDirect</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">
            🌾 FarmDirect
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="farmer.html">Farmer</a>
            <a href="buyer.html">Buyer</a>
            <a href="market.html">Market Trends</a>
        </nav>

    </header>


    <main class="dashboard">

        <h1>👨‍🌾 Farmer Dashboard</h1>

        <p class="subtitle">
            Manage your agricultural products and sales.
        </p>


        <!-- Statistics -->

        <div class="stats">

            <div class="stat-card">
                <h3>Total Products</h3>
                <p id="totalProducts">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Orders</h3>
                <p id="totalOrders">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Sales</h3>
                <p>₹<span id="totalSales">0</span></p>
            </div>

        </div>


        <!-- Add Product -->

        <section class="form-section">

            <h2>➕ Add New Product</h2>

            <form id="productForm">

                <div class="form-group">

                    <label>Product Name</label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Example: Tomato"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Category</label>

                    <select id="productCategory" required>

                        <option value="">Select Category</option>
                        <option>Vegetables</option>
                        <option>Fruits</option>
                        <option>Grains</option>
                        <option>Pulses</option>

                    </select>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>Quantity (kg)</label>

                        <input
                            type="number"
                            id="productQuantity"
                            placeholder="500"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Price (₹/kg)</label>

                        <input
                            type="number"
                            id="productPrice"
                            placeholder="25"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>Location</label>

                    <input
                        type="text"
                        id="productLocation"
                        placeholder="Example: Guntur"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Description</label>

                    <textarea
                        id="productDescription"
                        placeholder="Enter product details..."
                    ></textarea>

                </div>


                <button type="submit" class="btn">
                    Add Product
                </button>

            </form>

        </section>


        <!-- My Products -->

        <section class="products-section">

            <h2>🌾 My Products</h2>

            <div id="farmerProducts" class="product-grid">

                <!-- JavaScript products appear here -->

            </div>

        </section>


        <!-- Orders -->

        <section class="orders-section">

    <h2>📦 Orders Received</h2>

    <div id="farmerOrders">
        <!-- Orders generated by JavaScript -->
    </div>

</section>

    </main>


    <footer>

        <p>© 2026 FarmDirect</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
